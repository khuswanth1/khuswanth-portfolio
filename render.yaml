services:
  - type: web
    name: portfolio-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn portfolio_api.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_ENV
        value: production
      - key: TRUSTED_PROXY_COUNT
        value: 1
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB3FORMS_KEY
        sync: false
      - key: EMAIL_TO
        value: khuswanthraojadav@gmail.com
